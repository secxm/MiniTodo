<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniTodo</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <!-- Title Bar -->
    <div class="title-bar">
        <div class="logo">
            <span class="dot"></span>MiniTodo
        </div>
        <div class="actions">
            <button id="btn-minimize" class="btn" title="最小化">─</button>
            <button id="btn-close" class="btn btn-close" title="关闭到托盘">✕</button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button id="tab-pending" class="btn active">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
            待办
        </button>
        <button id="tab-notes" class="btn">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
            便签
        </button>
    </div>

    <!-- Filter Tags + History Entry (pending only) -->
    <div class="filter-tags" id="filter-tags">
        <button class="btn active" data-filter="today">今日</button>
        <button class="btn" data-filter="important">重要</button>
        <button class="btn" data-filter="overdue">过期</button>
        <button class="btn" data-filter="all">所有</button>
        <span class="filter-sep"></span>
        <button class="btn btn-history-entry" id="btn-history-entry">
            <span class="icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
            全部
        </button>
    </div>

    <!-- Add Bar (pending only) -->
    <div id="add-bar" class="add-bar">
        <input type="text" id="input-title" class="form-control" placeholder="输入待办..." />
        <div class="date-wrapper">
            <input type="text" id="input-due" class="form-control" placeholder="到期日期" readonly />
            <span class="date-icon"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span></span>
        </div>
        <button class="btn btn-priority" id="btn-priority" title="标记为重要">★</button>
        <button class="btn btn-add" id="btn-add" title="添加">+</button>
    </div>

    <!-- Notes Area (notes only) -->
    <div id="notes-area" class="notes-area" style="display:none;">
        <textarea id="note-editor" placeholder="在这里记录临时内容..."></textarea>
        <div class="notes-save-status" id="note-save-status">已保存</div>
    </div>

    <!-- History Header -->
    <div class="history-header" id="history-header" style="display:none;">
        <button class="btn btn-history-back" id="btn-history-back">← 返回待办</button>
        <div class="history-status-filter" id="history-status-filter">
            <button class="btn active" data-status="all">全部</button>
            <button class="btn" data-status="pending">未完成</button>
            <button class="btn" data-status="done">已完成</button>
        </div>
    </div>

    <!-- Todo List -->
    <div class="todo-list" id="todo-list"></div>

    <!-- Pagination Bar (history only) -->
    <div class="pagination-bar" id="pagination-bar" style="display:none;">
        <div class="pagination-btns" id="pagination-btns"></div>
        <div class="pagination-info" id="pagination-info"></div>
    </div>

    <!-- Footer -->
    <div class="footer">笃行安庐</div>

    <!-- Context Menu -->
    <div class="context-menu" id="context-menu">
        <button id="ctx-edit" class="btn"><span class="icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span> 编辑</button>
        <button id="ctx-toggle" class="btn"><span class="icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg></span> 切换状态</button>
        <div class="ctx-divider"></div>
        <button id="ctx-delete" class="btn ctx-delete"><span class="icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span> 删除</button>
    </div>

    <!-- Date Picker -->
    <div class="date-picker-overlay" id="dp-overlay"></div>
    <div class="date-picker-popup" id="dp-popup">
        <div class="dp-header">
            <button id="dp-prev" class="btn">◀</button>
            <div class="dp-month-year" id="dp-month-year"></div>
            <button id="dp-next" class="btn">▶</button>
        </div>
        <div class="dp-weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="dp-days" id="dp-days"></div>
        <div class="dp-footer">
            <button class="btn dp-clear" id="dp-clear">清除</button>
            <button class="btn dp-today" id="dp-today">今天</button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-box">
            <div class="modal-icon"><span class="icon" style="width:28px;height:28px"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span></div>
            <div class="modal-title">确认删除</div>
            <div class="modal-text">确定要删除这条记录吗？<br>此操作不可撤销。</div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="modal-cancel">取消</button>
                <button class="btn btn-confirm" id="modal-confirm">确认删除</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="edit-modal-overlay" id="edit-modal">
        <div class="edit-modal-box">
            <div class="em-title">编辑待办</div>
            <div class="em-field">
                <label>待办名称</label>
                <input type="text" id="em-title" class="form-control" placeholder="待办事项名称" />
            </div>
            <div class="em-field">
                <label>到期时间</label>
                <div class="em-date-wrapper">
                    <input type="text" id="em-due" class="form-control" placeholder="选择日期" readonly />
                    <span class="em-date-icon"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span></span>
                </div>
            </div>
            <div class="em-field" id="em-field-created" style="display:none;">
                <label>创建时间</label>
                <div class="em-date-wrapper">
                    <input type="text" id="em-created" class="form-control" placeholder="选择日期" readonly />
                    <span class="em-date-icon"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span></span>
                </div>
            </div>
            <div class="em-field" id="em-field-done" style="display:none;">
                <label>完成时间</label>
                <div class="em-date-wrapper">
                    <input type="text" id="em-done" class="form-control" placeholder="选择日期" readonly />
                    <span class="em-date-icon"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span></span>
                </div>
            </div>
            <div class="em-field">
                <label>优先级</label>
                <div class="priority-group" id="em-priority-group">
                    <button class="btn active" data-priority="normal">一般</button>
                    <button class="btn" data-priority="important">重要</button>
                </div>
            </div>
            <div class="em-buttons">
                <button class="btn em-cancel" id="em-cancel">取消</button>
                <button class="btn em-save" id="em-save">保存修改</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/render.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/events.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
